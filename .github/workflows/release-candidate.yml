name: Build Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 2.0.0
        required: true
        type: string
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Signed and notarized candidate
    runs-on: macos-26
    env:
      ARCHIVE_PATH: build/IconChanger.xcarchive
      APP_PATH: build/IconChanger.app
      DMG_PATH: build/candidate/IconChanger.dmg
      CANDIDATE_DIR: build/candidate
    steps:
      - name: Checkout requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate version and source
        run: |
          VERSION="${{ inputs.version }}"
          python3 scripts/build-number.py "$VERSION" >/dev/null
          BUILD_NUMBER=$(python3 scripts/build-number.py "$VERSION")
          SOURCE_SHA=$(git rev-parse HEAD)
          TAG="v$VERSION"

          IS_PRERELEASE=false
          case "$VERSION" in
            *pre*|*alpha*|*beta*|*rc*) IS_PRERELEASE=true ;;
          esac

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

      - name: Run regression tests
        run: bash tests/run.sh

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project IconChanger.xcodeproj \
            -scheme IconChanger \
            -derivedDataPath build/DerivedData

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_P12"
          test -n "$CERTIFICATE_PASSWORD"

          KEYCHAIN_PATH="$RUNNER_TEMP/iconchanger-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          CERTIFICATE_PATH="$RUNNER_TEMP/iconchanger-certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
              head -1
          )
          test -n "$SIGNING_IDENTITY" || {
            echo "CERTIFICATE_P12 must contain a Developer ID Application certificate." >&2
            exit 1
          }

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Archive signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID"
          mkdir -p build

          xcodebuild archive \
            -project IconChanger.xcodeproj \
            -scheme IconChanger \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            -archivePath "$ARCHIVE_PATH" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            -quiet

          ditto "$ARCHIVE_PATH/Products/Applications/IconChanger.app" "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

          ditto -c -k --keepParent "$APP_PATH" build/IconChanger-notary.zip
          xcrun notarytool submit build/IconChanger-notary.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Build styled DMG
        run: |
          python3 -m venv "$RUNNER_TEMP/iconchanger-release-tools"
          "$RUNNER_TEMP/iconchanger-release-tools/bin/pip" \
            install --disable-pip-version-check "dmgbuild==1.6.7"
          export PATH="$RUNNER_TEMP/iconchanger-release-tools/bin:$PATH"

          mkdir -p "$CANDIDATE_DIR"
          scripts/create-dmg.sh "$APP_PATH" "$DMG_PATH"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG_PATH"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          scripts/validate-release-artifact.sh \
            "$DMG_PATH" \
            "$VERSION" \
            "$BUILD_NUMBER"

      - name: Sign Sparkle update and create metadata
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          test -n "$SPARKLE_KEY"
          SPARKLE_BIN="$PWD/build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin"
          SIGN_UPDATE="$SPARKLE_BIN/sign_update"
          test -x "$SIGN_UPDATE"

          umask 077
          SPARKLE_KEY_FILE="$RUNNER_TEMP/iconchanger-sparkle-key"
          printf '%s' "$SPARKLE_KEY" > "$SPARKLE_KEY_FILE"
          ED_SIGNATURE=$("$SIGN_UPDATE" -p --ed-key-file "$SPARKLE_KEY_FILE" "$DMG_PATH")
          "$SIGN_UPDATE" --verify \
            --ed-key-file "$SPARKLE_KEY_FILE" \
            "$DMG_PATH" \
            "$ED_SIGNATURE"
          rm -f "$SPARKLE_KEY_FILE"

          DMG_SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          DMG_SIZE=$(stat -f%z "$DMG_PATH")
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          {
            echo "## What's Changed"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              git log --pretty=format:"- %s" "$PREVIOUS_TAG..HEAD" -- \
                ':!IconChanger/Resources/sparkle.xml'
              echo
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${TAG}"
            else
              git log --pretty=format:"- %s"
            fi
          } > "$CANDIDATE_DIR/CHANGELOG.md"

          jq -n \
            --arg version "$VERSION" \
            --arg build "$BUILD_NUMBER" \
            --arg tag "$TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg repository "${{ github.repository }}" \
            --arg sha256 "$DMG_SHA256" \
            --arg ed_signature "$ED_SIGNATURE" \
            --argjson dmg_size "$DMG_SIZE" \
            --argjson prerelease "$IS_PRERELEASE" \
            '{
              version: $version,
              build: $build,
              tag: $tag,
              source_sha: $source_sha,
              repository: $repository,
              sha256: $sha256,
              dmg_size: $dmg_size,
              ed_signature: $ed_signature,
              prerelease: $prerelease
            }' > "$CANDIDATE_DIR/candidate.json"

      - name: Upload candidate for user testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IconChanger-${{ env.VERSION }}-candidate
          path: build/candidate/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
