name: Build Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 1.5.0-pre.1
        required: true
        type: string
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: main
        type: string
      signing_mode:
        description: Prefer Apple Development when valid, or force one mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - apple-development
          - adhoc

permissions:
  contents: read

jobs:
  candidate:
    name: Release candidate
    runs-on: macos-26
    env:
      APP_PATH: build/IconChanger.app
      DMG_PATH: build/candidate/IconChanger.dmg
      CANDIDATE_DIR: build/candidate
    steps:
      - name: Checkout requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate version and source
        run: |
          VERSION="${{ inputs.version }}"
          python3 scripts/build-number.py "$VERSION" >/dev/null
          BUILD_NUMBER=$(python3 scripts/build-number.py "$VERSION")
          SOURCE_SHA=$(git rev-parse HEAD)
          TAG="v$VERSION"

          IS_PRERELEASE=false
          case "$VERSION" in
            *pre*|*alpha*|*beta*|*rc*) IS_PRERELEASE=true ;;
          esac

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

      - name: Run regression tests
        run: bash tests/run.sh

      - name: Select candidate signing identity
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          REQUESTED_SIGNING_MODE: ${{ inputs.signing_mode }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/iconchanger-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          CERTIFICATE_PATH="$RUNNER_TEMP/iconchanger-signing.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/iconchanger-signing.pem"
          SIGNING_PROBE="$RUNNER_TEMP/iconchanger-signing-probe"
          SIGNING_IDENTITY="-"
          SIGNING_KIND="adhoc"
          SIGNING_ENTITLEMENTS="IconChanger/IconChanger.ad-hoc.entitlements"
          SIGNING_KEYCHAIN_FLAGS=""

          if [[ "$REQUESTED_SIGNING_MODE" != "adhoc" ]]; then
            imported=false
            if [[ -n "$CERTIFICATE_P12" && -n "$CERTIFICATE_PASSWORD" ]]; then
              if (
                set -e
                security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                printf '%s' "$CERTIFICATE_P12" |
                  base64 --decode > "$CERTIFICATE_PATH"
                security import "$CERTIFICATE_PATH" \
                  -P "$CERTIFICATE_PASSWORD" \
                  -A \
                  -t cert \
                  -f pkcs12 \
                  -k "$KEYCHAIN_PATH"
                security set-key-partition-list \
                  -S apple-tool:,apple: \
                  -k "$KEYCHAIN_PASSWORD" \
                  "$KEYCHAIN_PATH"
                security list-keychains -d user \
                  -s "$KEYCHAIN_PATH" login.keychain-db
              ); then
                imported=true
              fi
            fi

            if [[ "$imported" == "true" ]]; then
              IDENTITY_REPORT=$(
                security find-identity -v -p codesigning "$KEYCHAIN_PATH"
              )
              SIGNING_IDENTITY=$(
                printf '%s\n' "$IDENTITY_REPORT" |
                  python3 scripts/select-signing-identity.py \
                    --mode "$REQUESTED_SIGNING_MODE"
              )

              if [[ "$SIGNING_IDENTITY" != "-" ]]; then
                certificate_usable=false
                if security find-certificate \
                    -c "Apple Development" \
                    -p \
                    "$KEYCHAIN_PATH" > "$CERTIFICATE_PEM" &&
                  openssl x509 -checkend 0 -noout -in "$CERTIFICATE_PEM"; then
                  ditto /usr/bin/true "$SIGNING_PROBE"
                  if codesign --force \
                      --sign "$SIGNING_IDENTITY" \
                      --keychain "$KEYCHAIN_PATH" \
                      --timestamp=none \
                      "$SIGNING_PROBE" &&
                    codesign --verify --strict "$SIGNING_PROBE"; then
                    certificate_usable=true
                  fi
                fi

                if [[ "$certificate_usable" == "true" ]]; then
                  SIGNING_KIND="apple-development"
                  SIGNING_ENTITLEMENTS="IconChanger/IconChanger.entitlements"
                  SIGNING_KEYCHAIN_FLAGS="--keychain $KEYCHAIN_PATH"
                elif [[ "$REQUESTED_SIGNING_MODE" == "apple-development" ]]; then
                  echo "The Apple Development certificate cannot sign valid code." >&2
                  exit 1
                else
                  SIGNING_IDENTITY="-"
                fi
              fi
            elif [[ "$REQUESTED_SIGNING_MODE" == "apple-development" ]]; then
              echo "The Apple Development certificate could not be imported." >&2
              exit 1
            fi
          fi

          echo "Candidate signing mode: $SIGNING_KIND"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KIND=$SIGNING_KIND" >> "$GITHUB_ENV"
          echo "SIGNING_ENTITLEMENTS=$SIGNING_ENTITLEMENTS" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_FLAGS=$SIGNING_KEYCHAIN_FLAGS" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project IconChanger.xcodeproj \
            -scheme IconChanger \
            -derivedDataPath build/DerivedData

      - name: Build candidate app
        run: |
          mkdir -p build

          xcodebuild build \
            -project IconChanger.xcodeproj \
            -scheme IconChanger \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="$SIGNING_KEYCHAIN_FLAGS" \
            -quiet

          ditto \
            build/DerivedData/Build/Products/Release/IconChanger.app \
            "$APP_PATH"
          if [[ "$SIGNING_KIND" == "adhoc" ]]; then
            codesign --force \
              --sign - \
              --options runtime \
              --timestamp=none \
              --entitlements "$SIGNING_ENTITLEMENTS" \
              "$APP_PATH"
          fi
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          SIGNATURE_DETAILS=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          if [[ "$SIGNING_KIND" == "apple-development" ]]; then
            grep -F "Authority=Apple Development:" <<< "$SIGNATURE_DETAILS"
          else
            grep -F "Signature=adhoc" <<< "$SIGNATURE_DETAILS"
          fi
          scripts/validate-launchable-executable.sh \
            "$APP_PATH/Contents/MacOS/IconChanger"

      - name: Build styled DMG
        run: |
          python3 -m venv "$RUNNER_TEMP/iconchanger-release-tools"
          "$RUNNER_TEMP/iconchanger-release-tools/bin/pip" \
            install --disable-pip-version-check "dmgbuild==1.6.7"
          export PATH="$RUNNER_TEMP/iconchanger-release-tools/bin:$PATH"

          mkdir -p "$CANDIDATE_DIR"
          scripts/create-dmg.sh "$APP_PATH" "$DMG_PATH"
          codesign --force --sign - "$DMG_PATH"
          scripts/validate-release-artifact.sh \
            "$DMG_PATH" \
            "$VERSION" \
            "$BUILD_NUMBER"

      - name: Sign Sparkle update and create metadata
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          test -n "$SPARKLE_KEY"
          SPARKLE_BIN="$PWD/build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin"
          SIGN_UPDATE="$SPARKLE_BIN/sign_update"
          test -x "$SIGN_UPDATE"

          umask 077
          SPARKLE_KEY_FILE="$RUNNER_TEMP/iconchanger-sparkle-key"
          printf '%s' "$SPARKLE_KEY" > "$SPARKLE_KEY_FILE"
          ED_SIGNATURE=$("$SIGN_UPDATE" -p --ed-key-file "$SPARKLE_KEY_FILE" "$DMG_PATH")
          "$SIGN_UPDATE" --verify \
            --ed-key-file "$SPARKLE_KEY_FILE" \
            "$DMG_PATH" \
            "$ED_SIGNATURE"
          rm -f "$SPARKLE_KEY_FILE"

          DMG_SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          DMG_SIZE=$(stat -f%z "$DMG_PATH")
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          {
            echo "## What's Changed"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              git log --pretty=format:"- %s" "$PREVIOUS_TAG..HEAD" -- \
                ':!IconChanger/Resources/sparkle.xml'
              echo
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${TAG}"
            else
              git log --pretty=format:"- %s"
            fi
          } > "$CANDIDATE_DIR/CHANGELOG.md"

          jq -n \
            --arg version "$VERSION" \
            --arg build "$BUILD_NUMBER" \
            --arg tag "$TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg repository "${{ github.repository }}" \
            --arg signing "$SIGNING_KIND" \
            --arg sha256 "$DMG_SHA256" \
            --arg ed_signature "$ED_SIGNATURE" \
            --argjson dmg_size "$DMG_SIZE" \
            --argjson prerelease "$IS_PRERELEASE" \
            '{
              version: $version,
              build: $build,
              tag: $tag,
              source_sha: $source_sha,
              repository: $repository,
              signing: $signing,
              sha256: $sha256,
              dmg_size: $dmg_size,
              ed_signature: $ed_signature,
              prerelease: $prerelease
            }' > "$CANDIDATE_DIR/candidate.json"

      - name: Upload candidate for user testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IconChanger-${{ env.VERSION }}-candidate
          path: build/candidate/
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/iconchanger-signing.p12" \
            "$RUNNER_TEMP/iconchanger-signing.pem" \
            "$RUNNER_TEMP/iconchanger-signing-probe"
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
