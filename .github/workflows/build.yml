name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run regression tests
        run: bash tests/run.sh

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project IconChanger.xcodeproj -scheme IconChanger

      - name: Build
        run: |
          xcodebuild build \
            -project IconChanger.xcodeproj \
            -scheme IconChanger \
            -configuration Release \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
